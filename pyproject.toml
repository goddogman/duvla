[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duvla"
version = "0.1.0"
description = "DuVLA: resource-efficient Qwen-based robot policy learning and LIBERO evaluation"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.13"
dependencies = [
    "pyarrow>=15.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.6,<3", "torchvision>=0.21,<1", "numpy>=1.26,<3", "h5py>=3.11,<4",
    "Pillow>=10", "einops>=0.8", "imageio>=2.34", "imageio-ffmpeg>=0.5",
]
qwen = [
    "transformers==4.57.6",
    "huggingface_hub==0.36.2",
    "tokenizers==0.22.2",
    "accelerate==1.14.0",
]
eval = [
    "mujoco==3.8.1", "robosuite==1.4.0", "bddl==1.0.1", "easydict==1.13",
    "gym==0.26.2", "gymnasium==1.3.0", "PyYAML>=6", "matplotlib>=3",
    "cloudpickle>=3", "termcolor>=3",
]
dev = ["pytest>=8,<10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["duvla.ds4_vla", "duvla.ds4_vla.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
